citizens:
- id: CIT-01
  key: laws
  name: LAWS
  category: governance
  authority_owner: studio_policy_owner
  responsibility: Define mandatory invariants and precedence
  inputs:
  - approved_policy
  outputs:
  - law_registry
  dependencies: []
  permitted_effects:
  - propose
  - read_scoped_inputs
  - emit_candidate_or_evidence
  prohibited_effects: &id001
  - self_approve_protected_mutation
  - invent_missing_authority
  - promote_unverified_candidate
  state_owner: studio_policy_owner
  mutation_boundary: candidate_only_unless_separately_authorized
  failure_mode: fail_closed_and_record
  verification:
    required_evidence:
    - pinned_input_identity
    - outcome_receipt
    acceptance_gates:
    - authority_consistency
    - referential_integrity
