schema_version: 1
kind: current_operating_structure
as_of: "2026-10-16"
status: descriptive_documentation
invariant: MACHINE_AUTOMATED_EXECUTION_REQUIRED
summary: >-
  CodeExp2 is the development/evidence workspace. Desktop/Machine holds persistent
  custody and the installed fail-closed guard. Automatic workflow execution remains
  unqualified and blocked; this development arrangement is not a qualified runtime loop.
authority: >-
  Owner intent and reserved decisions do not broaden harness/OS permissions or
  authorize hidden manual execution. Startup remains read-only.

owner_workflow_requirement:
  reference: AUTOMATED_WORKFLOW_REQUIREMENTS.md
  scope: Machine and every adapter it uses, controls or communicates with, including every new or edited feature.
  required: Zero manual start/stop, communication, coordinator restart or handover during workflow execution; failures must be visible and block before effects.
  enforcement_state: installed
  automation_verdict: FAIL_UNQUALIFIED

components:
  user:
    role: human_owner
    responsibilities: [intent, scope, budget, reserved_acceptance]
  coordinator_agent:
    role: development_coordinator
    workspace: /Users/boandersson/Desktop/CodeExp2
    execution_boundary: >-
      The model generates responses/tool requests; its harness assembles context,
      checks permissions, executes tools and returns results. This conversation is
      not a persistent Machine-managed workflow executor.
  machine_infrastructure:
    path: /Users/boandersson/Desktop/Machine
    entry: ./Machine
    implementation:
      coordination: src/machine.py
      invariant: src/workflow_invariant.py
      scratch_admission: src/admission.py
      native_bridge: src/native_bridge.py
      native_socket: src/native_socket.py
    custody: [.machine/state.sqlite3, .machine/admission]
    authority_model: local_operator_trust
    enforcement: >-
      The CLI, core task API, bridge sender, socket RPC/frame emission and scratch
      executor reject new workflow effects. Health exposes the invariant error and
      exit 3. Existing evidence reconciliation cannot re-enable execution.
  project_agents:
    location: separate_project_repositories
    example: /Users/boandersson/Desktop/Blender_Project
    runtime_binding: no_qualified_automatic_provider
    boundary: Project source, scenes, account/billing, permissions and domain acceptance remain project-owned.

change_control:
  instructions: AGENTS.md and target Machine/AGENTS.md
  staged_verifier: scripts/check_workflow_invariant.py
  installed_hook_directory: /Users/boandersson/Desktop/Machine/.git/machine-invariant-hooks
  rules:
    - Every new or edited feature and adapter must preserve the invariant.
    - Executable edits require meaningful staged invariant regressions.
    - The installed pinned verifier tests index blobs, not unstaged fixes.
    - Missing, skipped, expected-failure, undiscovered or unsuccessful mandatory test IDs and missing completion reports block loudly.
    - Unknown executable integration and disabled hooks/checkers block.
    - Protected policy/provider changes require independent review and recorded adoption.

capability_state:
  established:
    - Durable historical inspection/admission custody, including consumed permit and queue history.
    - Independent V3 source PASS, 98 passing tests and 14 real disposable commit cases for the installed stop barrier.
    - Installed loud denial of unqualified workflow execution; no manual fallback.
  failed_live_acceptance:
    task: native-inspection-fresh-start-001
    state: delivered_transport_custody_only
    version: 3
    attempts: 1
    reason: No live Brainstorm receiver was established; queued input is not execution.
  outstanding:
    - Persistent automatic orchestration and coordinator lifecycle.
    - Qualified managed project-executor lifecycle and exact receiving readiness.
    - Automatic communication, verification routing, handover and observable recovery.
    - Real automatic end-to-end acceptance with zero execution interventions.
    - Authenticated scoped grants and qualified production adapters.

references:
  - AGENTS.md
  - AUTOMATED_WORKFLOW_REQUIREMENTS.md
  - CURRENT_MISSION.md
  - DESIGN_AND_MISSION.md
  - DOCUMENTATION_INDEX.md
  - INVARIANT_ENFORCEMENT/README.md
  - /Users/boandersson/Desktop/Machine/docs/WORKFLOW_INVARIANT.md
  - /Users/boandersson/Desktop/Machine/docs/RUNBOOK.md
